<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EDELUXE Précommande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1B2E;--gold:#D9A441;--bg:#F4F6FA;--mut:#4A5568;--line:#E4E9F2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,sans-serif}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hd{background:var(--ink);color:#fff;padding:24px 22px 28px;border-radius:0 0 28px 28px}
.brand{font:700 18px Sora,sans-serif;letter-spacing:.08em}
.brand small{color:var(--gold);font-size:10px;letter-spacing:.2em;font-weight:600}
h1{font:700 26px/1.2 Sora,sans-serif;margin:24px 0 6px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(14,27,46,.08);margin:16px 16px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row span:first-child{color:var(--mut)}.row b{text-align:right}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:var(--gold);color:var(--ink);font:700 16px Sora,sans-serif;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{background:transparent;border:1.5px solid var(--ink)}
input,select{width:100%;height:50px;border:1.5px solid #C9D3E6;border-radius:14px;padding:0 14px;font:400 16px Inter,sans-serif;background:#fff;color:var(--ink)}
label{display:block;font:600 13px Inter,sans-serif;margin:14px 0 6px}
.chip{display:inline-block;background:#EEF2F9;border-radius:99px;padding:5px 11px;font:500 12px Inter,sans-serif}
.chip.on{background:var(--gold)}
.note{margin:16px 16px 0;padding:14px;border-radius:16px;background:#E6EEF9;font-size:13px}
.st{display:flex;gap:8px;margin-top:20px}
.st div{flex:1;text-align:center;font:500 11px Inter,sans-serif;color:#C9D3E6}
.st i{display:flex;width:28px;height:28px;margin:0 auto 5px;border-radius:14px;border:1.5px solid #5A6B88;align-items:center;justify-content:center;font:600 13px Inter,sans-serif;font-style:normal}
.st .d i{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.st .a i{background:#fff;border-color:#fff;color:var(--ink)}
canvas{width:100%;height:150px;border:2px dashed #8A98B3;border-radius:14px;background:#F9FAFD;touch-action:none;display:block}
.pad{padding:20px 16px 0}
.two{display:flex;gap:12px;margin:16px 16px 0}
.two>div{flex:1;border-radius:20px;padding:16px}
.err{color:#B42318;text-align:center;margin:10px 0 0}
</style>
</head>

function loadImg(u) {

    if (!u) return res(null);
    const i = new Image(), t = setTimeout(() => res(null), 6000);
    i.crossOrigin = 'anonymous';
    i.onload = () => { clearTimeout(t); try { const c = document.createElement('canvas'); c.width = i.naturalWidth; c.height = i.naturalHeight; c.getContext('2d').drawImage(i, 0, 0); res({d: c.toDataURL('image/jpeg', .85), w: i.naturalWidth, h: i.naturalHeight}); } catch (e) { res(null); } };
    i.onerror = () => { clearTimeout(t); res(null); };

  });
}

let REF, D, signing = false;
function client(t) {
  REF = db.collection('precommandes').doc(t);
  REF.onSnapshot(s => { D = s.exists ? s.data() : null; drawClient(); }, () => app(head('Lien indisponible', 'Contactez EDELUXE.')));
}
function drawClient() {
  const d = D;
  if (!d || d.statut === 'brouillon') return app(head('Lien indisponible', 'Cette offre n’est pas ou plus disponible.'));
  const s = d.statut;
  if (s === 'annulee' || s === 'remboursee') return app(head('Dossier ' + ST[s].toLowerCase(), esc(d.numero)));
  if (s === 'offre_envoyee' || s === 'signature_en_attente') return signing ? drawSign() : drawOffer();
  if (s === 'paiement_en_attente') return drawPay();
  drawDone();
}

  stop();
  app(head('Précommandes', 'Espace EDELUXE') + `<div class="pad"><button class="btn" id="nw">+ Nouvelle précommande</button></div>
  <div class="card"><input id="q" placeholder="Rechercher un nom ou un numéro" value="${esc(QUERY)}">
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ${VIEW === 'actifs' ? '' : 'btn2'}" id="t1" style="height:44px;font-size:14px">En cours</button><button class="btn ${VIEW === 'archives' ? '' : 'btn2'}" id="t2" style="height:44px;font-size:14px">Archives</button></div></div>
  <div id="ls"></div>
  <div class="pad"><button class="btn btn2" id="bkp">Sauvegarder tous les dossiers</button><button class="btn btn2" id="lo" style="margin-top:10px">Se déconnecter</button></div>`);
  $('#nw').onclick = () => form(null, null);
  $('#lo').onclick = () => auth.signOut();
  $('#t1').onclick = () => { VIEW = 'actifs'; dash(); };
  $('#t2').onclick = () => { VIEW = 'archives'; dash(); };
  $('#q').oninput = e => { QUERY = e.target.value; paint(); };
  $('#bkp').onclick = () => backupAll($('#bkp'));
  unsub = db.collection('precommandes').orderBy('creeLe', 'desc').onSnapshot(s => { DOCS = s.docs; ALLCOUNT = s.size; paint(); }, e => { if ($('#ls')) $('#ls').innerHTML = '<div class="note">Lecture impossible (' + e.code + ').</div>'; });
}
function paint() {
  const el = $('#ls'); if (!el) return;
  const q = QUERY.trim().toLowerCase();
  const rows = DOCS.filter(x => { const d = x.data(); return !!d.archive === (VIEW === 'archives') && (!q || (d.numero + ' ' + d.client.nom).toLowerCase().includes(q)); });
  el.innerHTML = rows.map(x => { const d = x.data(); return `<div class="card" data-id="${x.id}" style="cursor:pointer"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(d.numero)}</b><span class="chip ${d.statut === 'paiement_en_attente' ? 'on' : ''}">${ST[d.statut]}</span></div><div>${esc(d.client.nom)} · ${F(d.total)}</div></div>`; }).join('') || '<div class="note">Aucun dossier ici.</div>';
  el.querySelectorAll('[data-id]').forEach(e2 => { e2.onclick = () => detail(e2.dataset.id); });
}
async function backupAll(b) {
  const t = b.textContent; b.disabled = true; b.textContent = 'Préparation…';
  try {
    const iso = v => v && v.toDate ? v.toDate().toISOString() : v;
    const snap = await db.collection('precommandes').get(), out = [];
    for (const x of snap.docs) {
      const d = x.data(), h = await x.ref.collection('historique').get();
      out.push({id: x.id, ...d, creeLe: iso(d.creeLe), confirmeLe: iso(d.confirmeLe), historique: h.docs.map(y => ({...y.data(), date: iso(y.data().date)}))});
    }
    const blob = new Blob([JSON.stringify({exporteLe: new Date().toISOString(), dossiers: out}, null, 1)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'EDELUXE-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  } catch (e) { alert('Sauvegarde impossible (' + (e.code || e.message) + ').'); }
  b.disabled = false; b.textContent = t;
}
function form(id, d) {
  stop(); d = d || {client: {}, produit: {}, frais: {}};
  const f = (l, i, v, t) => `<label for="${i}">${l}</label><input id="${i}" ${t ? 'type="number" inputmode="numeric"' : ''} value="${esc(v ?? '')}">`;
  app(head(id ? 'Modifier l’offre' : 'Nouvelle précommande', 'Fiche client, produit et frais')
  + (d.statut === 'paiement_en_attente' ? '<div class="note"><b>Attention :</b> cette offre est déjà signée. Si vous l’enregistrez, la signature sera annulée et le client devra signer de nouveau. Vérifiez d’abord dans Wave qu’aucun paiement n’a été reçu.</div>' : '') + `<div class="card"><b>Client</b>${f('Nom et prénoms', 'nom', d.client.nom)}${f('WhatsApp avec indicatif (ex. 2250700000000)', 'tel', d.client.tel)}${f('Ville / commune', 'ville', d.client.ville)}</div>
  <div class="card"><b>Produit</b>${f('Nom du produit', 'pn', d.produit.nom)}${f('Lien de la photo (ImgBB)', 'ph', d.produit.photo)}${f('Quantité', 'qt', d.produit.qte, 1)}${f('Prix unitaire (FCFA)', 'pu', d.produit.pu, 1)}
  <label for="md">Mode d’expédition</label><select id="md"><option>Aérien</option><option>Maritime</option></select>${f('Délai estimé (ex. 15 à 20 jours)', 'dl', d.delai)}</div>
  <div class="card"><b>Frais</b>${f('Transport international (FCFA)', 'tr', d.frais.transport, 1)}${f('Livraison à Abidjan (FCFA)', 'lv', d.frais.livraison, 1)}${f('Frais annexes (FCFA)', 'an', d.frais.annexes, 1)}<div id="tt" style="margin-top:14px"></div></div>
  <div class="pad"><button class="btn" id="s1">Enregistrer et obtenir le lien</button><button class="btn btn2" id="s0" style="margin-top:10px">Enregistrer en brouillon</button><button class="btn btn2" id="bk" style="margin-top:10px">Retour</button><p class="err" id="er"></p></div>`);
  if (d.mode) $('#md').value = d.mode;
  const v = i => Number($('#' + i).value) || 0;
  const calc = () => { const t = v('qt') * v('pu') + v('tr') + v('lv') + v('an'), a = Math.round(t / 2); $('#tt').innerHTML = row('Total estimatif', F(t)) + row('Avance (50 %)', F(a)) + row('Solde à l’arrivée', F(t - a)); return [t, a]; };
  document.querySelectorAll('input').forEach(i => i.oninput = calc); calc();
  $('#bk').onclick = () => id ? detail(id) : dash();
  const save = async sent => {
    const g = i => $('#' + i).value.trim(), er = $('#er');
    if (g('nom').length < 2 || !/^\d{8,15}$/.test(g('tel')) || g('pn').length < 2 || v('qt') < 1 || v('pu') < 1) return er.textContent = 'Vérifiez : nom, WhatsApp (chiffres seulement), produit, quantité et prix.';
    const [t, a] = calc();
    const data = {client: {nom: g('nom'), tel: g('tel'), ville: g('ville')}, produit: {nom: g('pn'), photo: g('ph'), qte: v('qt'), pu: v('pu')}, mode: $('#md').value, delai: g('dl'), frais: {transport: v('tr'), livraison: v('lv'), annexes: v('an')}, total: t, avance: a, solde: t - a, statut: sent ? 'offre_envoyee' : 'brouillon'};
    const resign = id && d.statut === 'paiement_en_attente';
    if (resign) {
      if (!confirm('Cette offre a déjà été signée. En la modifiant, la signature sera annulée et le client devra signer de nouveau.\n\nVérifiez dans Wave qu’aucun paiement n’a été reçu pour ce dossier. Continuer ?')) return;
      data.signature = firebase.firestore.FieldValue.delete();
    }
    try {
      let key = id;
      if (!key) {
        key = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, '0')).join('');
        data.numero = 'PRE-' + new Date().getFullYear() + '-' + String(ALLCOUNT + 1).padStart(4, '0');
        data.creeLe = TS();
      }
      await db.collection('precommandes').doc(key).set(data, {merge: true});
      await db.collection('precommandes').doc(key).collection('historique').add({type: id ? 'modification' : 'creation', detail: resign ? 'Signature annulée, nouvelle signature requise' : ST[data.statut], date: TS()});
      detail(key);
    } catch (e) { er.textContent = 'Enregistrement impossible (' + e.code + ').'; }
  };
  $('#s1').onclick = () => save(true); $('#s0').onclick = () => save(false);
}
function detail(id) {
  stop();
  const ref = db.collection('precommandes').doc(id);
  unsub = ref.onSnapshot(async s => {
    if (!s.exists) return dash();
    const d = s.data(), h = await ref.collection('historique').orderBy('date', 'desc').get();
    const url = location.origin + location.pathname + '?p=' + id;
    const msg = `Bonjour ${d.client.nom}, votre proposition EDELUXE est prête : ${url}`;
    const editable = d.statut === 'brouillon' || d.statut === 'offre_envoyee' || d.statut === 'paiement_en_attente';
    const later = ['confirmee','en_transit','arrivee_abidjan','solde_paye','remise'].includes(d.statut);
    const adj = d.statut === 'en_transit' || d.statut === 'arrivee_abidjan';
    const closed = ['remise','annulee','remboursee'].includes(d.statut);
    const sd = d.ajust ? d.ajust.solde : d.solde;
    app(head(esc(d.numero), esc(ST[d.statut]))
    + `<div class="card">${row('Client', esc(d.client.nom))}${row('WhatsApp', esc(d.client.tel))}${row('Produit', esc(d.produit.nom) + ' × ' + d.produit.qte)}${row('Total estimatif', F(d.total))}${row('Avance (50 %)', F(d.avance))}${row('Solde', F(d.ajust ? d.ajust.solde : d.solde) + (d.ajust ? ' (ajusté)' : ''))}</div>`
    + (d.statut !== 'brouillon' ? `<div class="card"><b>Lien privé du client</b><input id="lk" readonly value="${esc(url)}" style="margin:10px 0"><button class="btn" id="cp">Copier le lien</button><a href="https://wa.me/${esc(d.client.tel)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><button class="btn btn2" style="margin-top:10px">Envoyer par WhatsApp</button></a></div>` : '')
    + `<div class="card"><b>Conditions de confirmation</b>${row('Contrat signé', d.signature ? 'Oui · ' + esc(new Date(d.signature.signeLe).toLocaleString('fr-FR')) : 'Non')}${row('Avance attendue', F(d.avance))}${row('Paiement reçu', d.refWaveAvance ? 'Oui · ' + esc(d.refWaveAvance) : 'Non')}
    ${d.signature ? `<img src="${d.signature.image}" alt="Signature" style="width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px">` : ''}
    ${d.statut === 'paiement_en_attente' ? `<label for="rf">Référence de transaction Wave</label><input id="rf" placeholder="Référence reçue dans Wave"><label style="display:flex;gap:12px;font-weight:500;margin-top:14px"><input id="mt" type="checkbox" style="width:24px;height:24px;flex:none"> J’ai vérifié dans Wave que le montant reçu est bien de ${F(d.avance)}.</label><button class="btn" id="pr" style="margin-top:14px" ${d.signature ? '' : 'disabled'}>Paiement reçu</button>` : ''}</div>`
    + (d.statut === 'arrivee_abidjan' ? `<div class="card"><b>Lien de paiement du solde</b>${row('Solde à payer', F(sd))}<input id="sl" readonly value="${esc(waveUrl(sd))}" style="margin:10px 0"><button class="btn" id="cs2">Copier le lien</button><a href="https://wa.me/${esc(d.client.tel)}?text=${encodeURIComponent('Bonjour ' + d.client.nom + ', votre marchandise est arrivée à Abidjan. Solde à payer : ' + F(sd) + ' via ce lien Wave : ' + waveUrl(sd))}" target="_blank" rel="noopener"><button class="btn btn2" style="margin-top:10px">Envoyer par WhatsApp</button></a></div>` : '')
    + (adj ? `<div class="card"><b>Ajustement du transport réel</b>${row('Transport estimé', F(d.frais.transport))}${row('Plafond (+10 %)', F(Math.round(d.frais.transport * 1.1)))}<label for="tr">Transport réel facturé (FCFA)</label><input id="tr" type="number" inputmode="numeric" value="${d.ajust ? d.ajust.reel : ''}"><label style="display:flex;gap:12px;font-weight:500"><input id="ac" type="checkbox" style="width:24px;height:24px;flex:none" ${d.ajust && d.ajust.accepte ? 'checked' : ''}> Le client a accepté le supplément au-delà de +10 %</label><div id="ap" style="margin-top:12px"></div><button class="btn" id="sa" style="margin-top:14px">Enregistrer l’ajustement</button></div>` : '')
    + (later ? `<div class="card"><label for="ns" style="margin-top:0">Changer le statut</label><select id="ns">${['en_transit','arrivee_abidjan','solde_paye','remise','annulee','remboursee'].map(k => `<option value="${k}">${ST[k]}</option>`).join('')}</select><button class="btn" id="cs" style="margin-top:12px">Mettre à jour</button></div>` : '')
    + `<div class="card"><b>Historique</b>${h.docs.map(x => { const e = x.data(); return row(esc(e.type) + (e.detail ? ' · ' + esc(e.detail) : ''), esc(when(e.date))); }).join('')}</div>
    <div class="pad">${editable ? '<button class="btn" id="ed" style="margin-bottom:10px">Modifier l’offre</button>' : ''}${closed && !d.archive ? '<button class="btn" id="ar" style="margin-bottom:10px">Archiver (télécharge le PDF)</button>' : ''}${d.archive ? '<button class="btn" id="rs" style="margin-bottom:10px">Restaurer depuis les archives</button>' : ''}<button class="btn btn2" id="dl" style="margin-bottom:10px">Télécharger le PDF</button><button class="btn btn2" id="bk">Retour à la liste</button></div>`);
    $('#bk').onclick = dash;
    $('#dl').onclick = () => pdfBtn($('#dl'), d);
    if ($('#cs2')) $('#cs2').onclick = () => navigator.clipboard.writeText($('#sl').value).then(() => { $('#cs2').textContent = 'Lien copié'; });
    if ($('#ar')) $('#ar').onclick = async () => {
      if (!confirm('Archiver ce dossier ? Son PDF sera téléchargé, puis il disparaîtra du tableau (il reste dans l’onglet Archives).')) return;
      try { await makePdf(d); } catch (e) { return alert('Archivage annulé : le PDF n’a pas pu être créé.'); }
      await ref.update({archive: true, archiveLe: new Date().toISOString()});
      await ref.collection('historique').add({type: 'archivage', detail: 'Dossier archivé', date: TS()});
      dash();
    };
    if ($('#rs')) $('#rs').onclick = async () => {
      await ref.update({archive: false});
      await ref.collection('historique').add({type: 'restauration', detail: 'Dossier restauré', date: TS()});
    };
    if ($('#ed')) $('#ed').onclick = () => form(id, d);
    if ($('#cp')) $('#cp').onclick = () => { $('#lk').select(); navigator.clipboard.writeText(url).then(() => { $('#cp').textContent = 'Lien copié'; }); };
    if ($('#pr')) $('#pr').onclick = async () => {
      const r = $('#rf').value.trim();
      if (r.length < 4) return alert('Saisissez la référence de transaction Wave.');
      if (!$('#mt').checked) return alert('Cochez la case : vérifiez d’abord le montant reçu dans Wave.');
      if (!d.signature) return;
      await ref.update({statut: 'confirmee', refWaveAvance: r, confirmeLe: TS()});
      await ref.collection('historique').add({type: 'paiement_valide', detail: r, date: TS()});
    };
    if ($('#tr')) {
      const pv = () => { const a = adjust(d, Number($('#tr').value) || 0, $('#ac').checked); $('#ap').innerHTML = row('Transport facturé', F(a.facture)) + row('Nouveau total', F(a.totalReel)) + row('Avance déjà payée', F(d.avance)) + row('Solde ajusté', F(a.solde)) + (a.depasse && !a.accepte ? '<div class="note" style="margin:10px 0 0">Le transport réel dépasse le plafond : seule la hausse de 10 % est facturée. Cochez la case une fois l’accord du client obtenu.</div>' : ''); };
      $('#tr').oninput = pv; $('#ac').onchange = pv; pv();
      $('#sa').onclick = async () => {
        const r = Number($('#tr').value);
        if (!(r > 0)) return alert('Saisissez le transport réel facturé.');
        const a = adjust(d, r, $('#ac').checked);
        await ref.update({ajust: {...a, le: new Date().toISOString()}});
        await ref.collection('historique').add({type: 'ajustement_transport', detail: F(a.facture) + ' · solde ' + F(a.solde), date: TS()});
      };
    }
    if ($('#cs')) $('#cs').onclick = async () => {
      const k = $('#ns').value;
      await ref.update({statut: k});
      await ref.collection('historique').add({type: 'statut', detail: ST[k], date: TS()});
    };
  });
}

/* ===================== DÉMARRAGE ===================== */
const tok = new URLSearchParams(location.search).get('p');
if (tok) client(tok);
else auth.onAuthStateChanged(u => {
  if (!u) return login();
  if (u.email !== ADMIN) { auth.signOut(); return login('Compte non autorisé.'); }
  dash();
});
</script>
</body>
</html>
